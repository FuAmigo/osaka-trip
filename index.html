/* ============ 天氣（Open-Meteo，免金鑰） ============ */
async function weather(i){
 const [dt,,city,la,lo,iso]=DAYS[i],el=$('#wx');if(!el)return;
 const base=`latitude=${la}&longitude=${lo}&timezone=Asia%2FTokyo`;
 let now='',fc='';
 try{const c=await (await fetch(`https://api.open-meteo.com/v1/forecast?${base}&current=temperature_2m,weather_code`)).json();
  now=`現在${city} <big>${WX[c.current.weather_code]||'🌡️'}</big> <b>${Math.round(c.current.temperature_2m)}°C</b>`}catch(e){}
 try{const r=await fetch(`https://api.open-meteo.com/v1/forecast?${base}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&start_date=${iso}&end_date=${iso}`);
  if(!r.ok)throw 0;const d=(await r.json()).daily;
  fc=`${dt} 預報 ${WX[d.weather_code[0]]||''} ${Math.round(d.temperature_2m_min[0])}–${Math.round(d.temperature_2m_max[0])}°C・降雨 ${d.precipitation_probability_max[0]??'–'}%`}
 catch(e){try{const p=`${+iso.slice(0,4)-1}${iso.slice(4)}`;
  const d=(await (await fetch(`https://archive-api.open-meteo.com/v1/archive?${base}&daily=weather_code,temperature_2m_max,temperature_2m_min&start_date=${p}&end_date=${p}`)).json()).daily;
  fc=`${dt} 還太早，先看去年同日 ${WX[d.weather_code[0]]||''} ${Math.round(d.temperature_2m_min[0])}–${Math.round(d.temperature_2m_max[0])}°C（出發前 16 天會自動變成預報）`}catch(e2){fc='預報暫時無法取得'}}
 if($('#wx'))$('#wx').innerHTML=`${now}<br>${fc}`;
}

  <a class="lk" target="_blank" rel="noopener" href="https://tabelog.com/rst/rstsearch?sw=${enc(q)}">🍙 在 Tabelog 搜尋「${esc(q)}」看評分</a>
  <a class="lk" target="_blank" rel="noopener" href="https://s.tabelog.com/tw/">🌐 Tabelog 台灣版首頁</a>
  <div class="btns"><button class="btn p" data-a="settl" data-v="${v}">✏️ ${x.tl?'修改':'填寫'} Tabelog 評分</button></div></div>`;showSheet()}
 else if(a==='settl'){const x=S.food[+v],t=prompt('填入 Tabelog 評分（例：3.58，可留空）',x.tl||'');if(t===null)return;x.tl=t.trim();$('#sheet').classList.remove('show');save()}
 else if(a==='delfph'){if(confirm('確定要刪除這張照片嗎？')){delete S.food[+v].img;$('#sheet').classList.remove('show');save()}}
 else if(a==='delph'){if(confirm('確定要刪除這張照片嗎？')){delete S.shop[+v].img;$('#sheet').classList.remove('show');save()}}
 else if(a==='addstore'){const t=$('#st-in').value.trim();if(!t||S.stores.includes(t))return;S.stores.push(t);openS[t]=true;save()}
 else if(a==='delstore'){const st=S.stores[+v];if(confirm('刪除「'+st+'」和裡面所有商品？')){S.shop=S.shop.filter(x=>x.store!==st);S.stores.splice(+v,1);save()}}
 else if(a==='editp'){const x=S.shop[+v],M=S.members,pm=Object.fromEntries((x.ppl||[]).map(p=>[p.n,p]));$('#sheet').innerHTML=`<div class="pane"><h2>編輯商品</h2>
  <label>商品名稱</label><input id="e-nm" value="${esc(x.text)}">
  <label>店家</label><select id="e-st">${S.stores.map(s=>`<option ${s===x.store?'selected':''}>${esc(s)}</option>`).join('')}</select>
  <label>日本標價（¥，單價）</label><input id="e-jp" type="number" inputmode="decimal" value="${esc(x.jp||'')}">
  <label>價格標示</label><select id="e-jt">${Object.entries(TXL).map(([k,t])=>`<option value="${k}" ${k===(x.jt||'ex10')?'selected':''}>${t[0]}</option>`).join('')}</select>
  <label>數量（沒指定人時使用；有指定人時以各人數量加總）</label><input id="e-qty" type="number" inputmode="numeric" value="${x.qty||1}">
  <label>台灣價格（NT$，單價，選填）</label><input id="e-tw" type="number" inputmode="numeric" value="${esc(x.tw||'')}">
  <label>備註</label><input id="e-note" value="${esc(x.note||'')}">
  <label>誰要買（勾選＋數量＋是否已買）</label>
  ${M.length?M.map(m=>{const p=pm[m];return `<div class="sr prow" data-m="${esc(m)}"><label class="mc"><input type="checkbox" class="pw" ${p?'checked':''}> ${isP(m)?'🛒 ':''}${esc(m)}</label>${isP(m)?`<select class="pb" style="max-width:110px"><option value="">誰幫買？</option>${S.members.filter(z=>!isP(z)).map(z=>`<option ${p&&p.by===z?'selected':''}>${esc(z)}</option>`).join('')}</select>`:''}<input class="pq" type="number" min="1" value="${p?(+p.q||1):1}" style="max-width:64px"><label class="mc"><input type="checkbox" class="pd" ${p&&p.done?'checked':''}> 已買</label></div>`}).join(''):'<div class="sub">還沒有成員，請先在購物表單或記帳分頁新增成員</div>'}
  <div class="btns"><button class="btn p" data-a="saveshop" data-v="${v}">儲存</button><button class="btn" data-a="close">取消</button></div></div>`;showSheet()}
 else if(a==='saveshop'){const x=S.shop[+v],nm=$('#e-nm').value.trim();if(!nm){alert('商品名稱不能空白');return}
  x.text=nm;x.store=$('#e-st').value;x.jp=$('#e-jp').value.replace(/[^\d.]/g,'');x.jt=$('#e-jt').value;x.qty=Math.max(1,+$('#e-qty').value||1);x.tw=$('#e-tw').value.replace(/[^\d.]/g,'');x.note=$('#e-note').value.trim();
  const rows=[...document.querySelectorAll('.prow')];
  if(rows.length){const old=Object.fromEntries((x.ppl||[]).map(p=>[p.n,p])),np=[];rows.forEach(r=>{if(!r.querySelector('.pw').checked)return;const m=r.dataset.m,o=old[m],dn=r.querySelector('.pd').checked;np.push({n:m,q:Math.max(1,+r.querySelector('.pq').value||1),by:isP(m)?(r.querySelector('.pb')||{}).value||'':'',done:dn,d:dn?((o&&o.done&&o.d)||td()):''})});x.ppl=np}
  if(x.ppl&&x.ppl.length)x.done=x.ppl.every(p=>p.done);
  $('#sheet').classList.remove('show');save()}
 else if(a==='pdone'){const x=S.shop[+v],p=x.ppl[+k];p.done=!p.done;p.d=p.done?td():'';x.done=x.ppl.every(q=>q.done);save()}
 else if(a==='swho'){shopWho=v;if(v)localStorage.setItem('who',v);R()}
 else if(a==='addproxy'){const n=(prompt('代購者名字（例：媽媽）')||'').trim().replace(/（代購）$/,'');if(!n)return;const m=n+'（代購）';if(!S.members.includes(m)){S.members.push(m);save()}}
 else if(a==='addmem2'){const n=(prompt('新成員名字')||'').trim();if(n&&!S.members.includes(n)){S.members.push(n);save()}}
 else if(a==='trf'){S.refund=(S.refund===false);save()}
 else if(a==='saveline'){S.line=$('#l-in').value.trim();save()}
 else if(a==='share'){e.preventDefault();navigator.clipboard?.writeText(location.href);alert('已複製！傳給旅伴就能一起編輯')}
});
function showSheet(){const s=$('#sheet'),p=s.querySelector&&s.querySelector('.pane');if(p&&!p.querySelector('.xc'))p.insertAdjacentHTML('afterbegin','<button class="xc" data-a="close" aria-label="關閉">✕</button>');s.classList.add('show')}
function squeeze(f){return new Promise(r=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);r(c.toDataURL('image/jpeg',.6))};im.onerror=()=>r('');im.src=u})}
async function addShop(){const t=$('#s-name').value.trim();if(!t)return;const f=$('#s-ph').files[0],st=$('#s-store').value,q=Math.max(1,+$('#s-qty').value||1);
 const ppl=[...document.querySelectorAll('.sw:checked')].map(i=>({n:i.value,q,done:false,d:''}));
 const ex=ppl.length?S.shop.find(y=>y.store===st&&y.text.trim().toLowerCase()===t.toLowerCase()&&(y.ppl||[]).length):null;
 if(ex&&confirm('「'+ex.text+'」已經在清單裡了。\n按「確定」＝把你們加進這一項的想買名單（同一項，各自記錄買了沒）\n按「取消」＝另外新增一筆')){
  ppl.forEach(p=>{const o=ex.ppl.find(y=>y.n===p.n);if(o)o.q=p.q;else ex.ppl.push(p)});ex.done=ex.ppl.every(p=>p.done);openS[st]=true;save();return}
 const x={id:Date.now()+'',store:st,text:t,jp:$('#s-jp').value,tw:$('#s-tw').value,jt:$('#s-jt').value,qty:q,note:$('#s-note').value.trim(),ppl,done:false,c:0};
 if(f){const m=await squeeze(f);if(m)x.img=m}
 openS[st]=true;S.shop.push(x);save()}
document.addEventListener('change',async e=>{const t=e.target;
 if(t.dataset&&t.dataset.fph!==undefined&&t.files[0]){const m=await squeeze(t.files[0]);const it=S.food[+t.dataset.fph];if(m&&it){it.img=m;$('#sheet').classList.remove('show');save()}return}
 if(t.dataset&&t.dataset.itph!==undefined&&t.files[0]){const m=await squeeze(t.files[0]);const it=S.items[day][+t.dataset.itph];if(m&&it){it.img=m;$('#sheet').classList.remove('show');save()}return}
if(t.dataset&&t.dataset.ph!==undefined&&t.files[0]){const m=await squeeze(t.files[0]);if(m&&S.shop[+t.dataset.ph]){S.shop[+t.dataset.ph].img=m;$('#sheet').classList.remove('show');save()}}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='n-in')document.querySelector('[data-a=addli]')?.click()});

 const u=['app','database'].map(n=>`https://www.gstatic.com/firebasejs/10.12.2/firebase-${n}-compat.js`);
 const s1=document.createElement('script');s1.src=u[0];s1.onload=()=>{const s2=document.createElement('script');s2.src=u[1];s2.onload=cb;document.head.appendChild(s2)};
 document.head.appendChild(s1)}
loadFB(boot);setInterval(tick,20000);
